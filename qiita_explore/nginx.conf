upstream flask_app {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 8080;

    gzip on;
    gzip_types application/json text/event-stream text/plain;
    gzip_min_length 1024;

    # SSE streams and regular API calls
    location /api/ {
        proxy_pass         http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;

        # Required for SSE — disable nginx buffering so tokens stream through immediately
        proxy_buffering        off;
        proxy_request_buffering off;
        # Matches gunicorn's --timeout 300 in start_barnacle.sh — these two
        # move together, or a slow pi turn gets cut by nginx before gunicorn
        # even has a chance to time it out itself.
        proxy_read_timeout     300s;
        proxy_connect_timeout  10s;

        # Let gunicorn's X-Accel-Buffering header take effect
        proxy_pass_header  X-Accel-Buffering;
    }

    # Static frontend files
    location / {
        root   /path/to/qiita_explore/frontend;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
