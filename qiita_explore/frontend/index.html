<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- api-base is relative by default (js/utils.js) so this file works
       same-origin behind any proxy -- production nginx, a Cloudflare
       Tunnel, whatever -- with no edits needed. Local dev with the
       frontend and backend on different origins (e.g. a static file
       server plus a loopback SSH tunnel) needs an explicit override,
       using 127.0.0.1 (not localhost) so it matches this page's host --
       see docs/08-frontend.md ("API base resolution") for why. Example:
       <meta name="api-base" content="http://127.0.0.1:5001/api"> -->
  <title>QiitaExplore</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=60" />
</head>
<body>
  <div id="root"></div>
  <!--
    Local dev (VS Code Live Server) has no build step — Babel standalone transpiles
    app.js in the browser. The compiled artifact only exists on the barnacle host
    and is irrelevant to the browser-served frontend, so we don't probe for it.
  -->
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  <script type="text/babel" src="js/utils.js?v=10"></script>
  <script type="text/babel" src="js/icons.js?v=5"></script>
  <script type="text/babel" src="js/hooks/useDropdown.js?v=3"></script>
  <script type="text/babel" src="js/loaders.js?v=4"></script>
  <script type="text/babel" src="js/auth.js?v=7"></script>
  <script type="text/babel" src="js/components.js?v=15"></script>
  <script type="text/babel" src="js/search_results_panel.js?v=2"></script>
  <script type="text/babel" src="js/hooks/useModelSelection.js?v=1"></script>
  <script type="text/babel" src="js/hooks/useUrlSync.js?v=1"></script>
  <script type="text/babel" src="js/app_state.js?v=23"></script>
  <script type="text/babel" src="js/app_render.js?v=37"></script>
  <script type="text/babel" src="js/merge_artifacts.js?v=9"></script>
  <script type="text/babel" src="js/merge_tree.js?v=9"></script>
  <script type="text/babel" src="js/merge_detail.js?v=7"></script>
  <script type="text/babel" src="js/merge_workspace.js?v=9"></script>
  <script type="text/babel" src="js/study_modal.js?v=12"></script>
  <script type="text/babel" src="js/app.js?v=7"></script>
</body>
</html>
