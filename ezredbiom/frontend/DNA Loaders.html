<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA Loaders</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0b1218;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: 52px;
  padding: 52px 40px;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

.eyebrow {
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: #4dada2;
  opacity: 0.6;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 200px);
  gap: 52px 64px;
}

@media (max-width: 520px) {
  .grid { grid-template-columns: 200px; }
}

.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.card-label {
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #4dada2;
  opacity: 0.38;
}
</style>
</head>
<body>

<span class="eyebrow">Organic Loaders</span>

<div class="grid">
  <div class="card">
    <canvas id="c1"></canvas>
    <span class="card-label">Wreath</span>
  </div>
  <div class="card">
    <canvas id="c2"></canvas>
    <span class="card-label">Helix</span>
  </div>
  <div class="card">
    <canvas id="c3"></canvas>
    <span class="card-label">Plasmid</span>
  </div>
  <div class="card">
    <canvas id="c4"></canvas>
    <span class="card-label">Infinity</span>
  </div>
</div>

<script>
'use strict';

const W = 200, H = 200;
const BG    = '#0b1218';
const TEAL  = '#1ea8a8';
const GREEN = '#40ad6e';
const CORAL = '#e07555';

function rgba(hex, a) {
  const n = parseInt(hex.replace('#', ''), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

const PALE = rgba('#9ad8d0', 0.28);

function setupCanvas(id) {
  const c = document.getElementById(id);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width  = W * dpr;
  c.height = H * dpr;
  c.style.width  = W + 'px';
  c.style.height = H + 'px';
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  return ctx;
}

const c1 = setupCanvas('c1'), c2 = setupCanvas('c2');
const c3 = setupCanvas('c3'), c4 = setupCanvas('c4');

/* Returns interior t-values in (t0, t1) where sin(n*t + ph) = 0, sorted. */
function ringCrossings(n, ph, t0, t1) {
  const out = [];
  for (let k = Math.ceil((n * t0 + ph) / Math.PI);
           k <= Math.floor((n * t1 + ph) / Math.PI); k++) {
    const t = (k * Math.PI - ph) / n;
    if (t > t0 + 1e-9 && t < t1 - 1e-9) out.push(t);
  }
  return out;
}

/* Build [start, end] segment list from sorted crossings between lo and hi. */
function makeSegs(crx, lo, hi) {
  const segs = []; let prev = lo;
  for (const c of crx) { segs.push([prev, c]); prev = c; }
  segs.push([prev, hi]);
  return segs;
}

/* ─── Loader 1: Wreath ────────────────────────────────────────────────────── */
function drawWreath(ph) {
  const cx = W / 2, cy = H / 2, R = 71, r = 22, n = 8;
  c1.clearRect(0, 0, W, H);

  /* Rungs — drawn before strands so strands paint over crossing ends */
  const RN = n * 5;
  for (let i = 0; i < RN; i++) {
    const t  = (i / RN) * Math.PI * 2;
    const s  = Math.sin(n * t + ph);
    const r1 = R + r * s, r2 = R - r * s;
    const isHL = (i % Math.round(RN / n)) === 0;
    c1.strokeStyle = isHL ? rgba(CORAL, 0.85) : PALE;
    c1.lineWidth   = isHL ? 2 : 1;
    c1.beginPath();
    c1.moveTo(cx + r1 * Math.cos(t), cy + r1 * Math.sin(t));
    c1.lineTo(cx + r2 * Math.cos(t), cy + r2 * Math.sin(t));
    c1.stroke();
  }

  /* Strands with per-segment z-ordering */
  const crx  = ringCrossings(n, ph, 0, Math.PI * 2);
  const segs = makeSegs(crx, 0, Math.PI * 2);

  function ringStrand(tS, tE, isS1, lw) {
    const N = Math.max(8, Math.round((tE - tS) / (Math.PI * 2) * 600));
    c1.beginPath();
    for (let i = 0; i <= N; i++) {
      const t   = tS + (i / N) * (tE - tS);
      const rad = R + r * Math.sin(n * t + ph) * (isS1 ? 1 : -1);
      const x   = cx + rad * Math.cos(t), y = cy + rad * Math.sin(t);
      i === 0 ? c1.moveTo(x, y) : c1.lineTo(x, y);
    }
    c1.lineWidth = lw; c1.lineCap = 'round'; c1.stroke();
  }

  for (const [tS, tE] of segs) {
    const f1top = Math.sin(n * (tS + tE) / 2 + ph) > 0;
    c1.strokeStyle = f1top ? rgba(GREEN, 0.75) : rgba(TEAL, 0.75);
    ringStrand(tS, tE, !f1top, 2);
    c1.strokeStyle = f1top ? TEAL : GREEN;
    ringStrand(tS, tE,  f1top, 3);
  }
}

/* ─── Loader 2: Linear Helix ─────────────────────────────────────────────── */
function drawHelix(time) {
  const cy = H / 2, A = 54, λ = 64, ω = 1.7;
  const f = Math.PI * 2 / λ, ph = ω * time;
  c2.clearRect(0, 0, W, H);

  /* Rungs */
  const RN = Math.round(W / λ * 8);
  for (let i = 0; i <= RN; i++) {
    const x = (i / RN) * W, p = f * x - ph;
    const y1 = cy + A * Math.sin(p), y2 = cy - A * Math.sin(p);
    if (Math.abs(y1 - y2) < A * 0.4) continue;
    const isHL = (i % Math.round(RN / 5)) === 0;
    c2.strokeStyle = isHL ? rgba(CORAL, 0.9) : PALE;
    c2.lineWidth   = isHL ? 2 : 1;
    c2.beginPath(); c2.moveTo(x, y1); c2.lineTo(x, y2); c2.stroke();
  }

  /* Find x-crossings where sin(f*x − ph) = 0 */
  const crx = [];
  for (let k = Math.ceil((f * 0 - ph) / Math.PI);
           k <= Math.floor((f * W - ph) / Math.PI); k++) {
    const x = (k * Math.PI + ph) / f;
    if (x > 0 && x < W) crx.push(x);
  }
  crx.sort((a, b) => a - b);
  const segs = makeSegs(crx, 0, W);

  function linStrand(x0, x1, isS1, lw) {
    if (x1 - x0 < 0.5) return;
    const N = Math.max(5, Math.ceil((x1 - x0) / λ * 100));
    c2.beginPath();
    for (let i = 0; i <= N; i++) {
      const x = x0 + (i / N) * (x1 - x0);
      const p = f * x - ph;
      const y = cy + A * Math.sin(isS1 ? p : p + Math.PI);
      i === 0 ? c2.moveTo(x, y) : c2.lineTo(x, y);
    }
    c2.lineWidth = lw; c2.lineCap = 'round'; c2.stroke();
  }

  for (const [x0, x1] of segs) {
    const f1top = Math.sin(f * (x0 + x1) / 2 - ph) > 0;
    c2.strokeStyle = f1top ? rgba(GREEN, 0.75) : rgba(TEAL, 0.75);
    linStrand(x0, x1, !f1top, 2);
    c2.strokeStyle = f1top ? TEAL : GREEN;
    linStrand(x0, x1,  f1top, 3);
  }

  /* Edge fades so the helix soft-clips at the canvas boundary */
  const g1 = c2.createLinearGradient(0, 0, 28, 0);
  g1.addColorStop(0, BG); g1.addColorStop(1, 'rgba(0,0,0,0)');
  c2.fillStyle = g1; c2.fillRect(0, 0, 28, H);
  const g2 = c2.createLinearGradient(W - 28, 0, W, 0);
  g2.addColorStop(0, 'rgba(0,0,0,0)'); g2.addColorStop(1, BG);
  c2.fillStyle = g2; c2.fillRect(W - 28, 0, 28, H);
}

/* ─── Loader 3: Plasmid ──────────────────────────────────────────────────── */
function drawPlasmid(time) {
  const cx = W / 2, cy = H / 2, R = 65, GAP = 15, N = 40;
  c3.clearRect(0, 0, W, H);

  for (let i = 0; i < N; i++) {
    const angle = (i / N) * Math.PI * 2 - Math.PI / 2;
    const pulse = 0.5 + 0.5 * Math.sin((i / N) * Math.PI * 4 - time * 2.6);

    const xi = cx + (R - GAP) * Math.cos(angle);
    const yi = cy + (R - GAP) * Math.sin(angle);
    const xo = cx + (R + GAP) * Math.cos(angle);
    const yo = cy + (R + GAP) * Math.sin(angle);

    /* Inner dot — teal, bright when pulse is high */
    c3.beginPath();
    c3.arc(xi, yi, 2.5 + 2 * pulse, 0, Math.PI * 2);
    c3.fillStyle = rgba(TEAL, 0.15 + 0.85 * pulse);
    c3.fill();

    /* Outer dot — green, bright when pulse is low */
    c3.beginPath();
    c3.arc(xo, yo, 2.5 + 2 * (1 - pulse), 0, Math.PI * 2);
    c3.fillStyle = rgba(GREEN, 0.15 + 0.85 * (1 - pulse));
    c3.fill();

    /* Base-pair rungs every 3 positions */
    if (i % 3 === 0) {
      const isHL = (i % 12) === 0;
      c3.strokeStyle = isHL ? rgba(CORAL, 0.5 + 0.5 * pulse) : rgba('#9ad8d0', 0.22);
      c3.lineWidth   = isHL ? 2 : 1;
      c3.beginPath();
      c3.moveTo(xi, yi); c3.lineTo(xo, yo);
      c3.stroke();
    }
  }
}

/* ─── Loader 4: Figure-8 / Infinity ──────────────────────────────────────── */
function drawInfinity(time) {
  const cx = W / 2, cy = H / 2;
  const SX = 74, SY = 40, r = 16, n = 5, ph = 0.85 * time;
  c4.clearRect(0, 0, W, H);

  /* Figure-8: x = SX·sin(t),  y = SY·sin(2t) */
  function figPos(t) {
    return [cx + SX * Math.sin(t), cy + SY * Math.sin(2 * t)];
  }

  /* Unit normal to the figure-8 curve at t */
  function figNorm(t) {
    const dx = SX * Math.cos(t), dy = 2 * SY * Math.cos(2 * t);
    const L  = Math.sqrt(dx * dx + dy * dy) || 1;
    return [-dy / L, dx / L];
  }

  const crx  = ringCrossings(n, ph, 0, Math.PI * 2);
  const segs = makeSegs(crx, 0, Math.PI * 2);

  /* Rungs */
  const RN = n * 6;
  for (let i = 0; i < RN; i++) {
    const t = (i / RN) * Math.PI * 2, s = Math.sin(n * t + ph);
    const [px, py] = figPos(t), [nx, ny] = figNorm(t);
    const isHL = (i % Math.round(RN / n)) === 0;
    c4.strokeStyle = isHL ? rgba(CORAL, 0.85) : PALE;
    c4.lineWidth   = isHL ? 2 : 1;
    c4.beginPath();
    c4.moveTo(px + r * s * nx, py + r * s * ny);
    c4.lineTo(px - r * s * nx, py - r * s * ny);
    c4.stroke();
  }

  /* Strands with z-ordering */
  function fig8Strand(tS, tE, isS1, lw) {
    const N = Math.max(10, Math.round((tE - tS) / (Math.PI * 2) * 600));
    c4.beginPath();
    for (let i = 0; i <= N; i++) {
      const t        = tS + (i / N) * (tE - tS);
      const s        = Math.sin(n * t + ph) * (isS1 ? 1 : -1);
      const [px, py] = figPos(t), [nx, ny] = figNorm(t);
      const x = px + r * s * nx, y = py + r * s * ny;
      i === 0 ? c4.moveTo(x, y) : c4.lineTo(x, y);
    }
    c4.lineWidth = lw; c4.lineCap = 'round'; c4.stroke();
  }

  for (const [tS, tE] of segs) {
    const f1top = Math.sin(n * (tS + tE) / 2 + ph) > 0;
    c4.strokeStyle = f1top ? rgba(GREEN, 0.75) : rgba(TEAL, 0.75);
    fig8Strand(tS, tE, !f1top, 2);
    c4.strokeStyle = f1top ? TEAL : GREEN;
    fig8Strand(tS, tE,  f1top, 3);
  }
}

/* ─── Animation loop ──────────────────────────────────────────────────────── */
let t0 = null;

function frame(ts) {
  if (!t0) t0 = ts;
  const t = (ts - t0) / 1000;
  drawWreath(t * 1.1);
  drawHelix(t);
  drawPlasmid(t);
  drawInfinity(t);
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
