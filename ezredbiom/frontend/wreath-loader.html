<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wreath Loader</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0b1218;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 200, H = 200;
const TEAL  = '#1ea8a8';
const GREEN = '#40ad6e';
const CORAL = '#e07555';

function rgba(hex, a) {
  const n = parseInt(hex.replace('#',''), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
const PALE = rgba('#9ad8d0', 0.28);

const canvas = document.getElementById('c');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width  = W * dpr;
canvas.height = H * dpr;
canvas.style.width  = W + 'px';
canvas.style.height = H + 'px';
const ctx = canvas.getContext('2d');
ctx.scale(dpr, dpr);

function ringCrossings(n, ph, t0, t1) {
  const out = [];
  for (let k = Math.ceil((n*t0+ph)/Math.PI); k <= Math.floor((n*t1+ph)/Math.PI); k++) {
    const t = (k*Math.PI - ph) / n;
    if (t > t0+1e-9 && t < t1-1e-9) out.push(t);
  }
  return out;
}

function makeSegs(crx, lo, hi) {
  const segs = []; let prev = lo;
  for (const c of crx) { segs.push([prev, c]); prev = c; }
  segs.push([prev, hi]);
  return segs;
}

function draw(ph) {
  const cx = W/2, cy = H/2, R = 71, r = 22, n = 8;
  ctx.clearRect(0, 0, W, H);

  const RN = n * 5;
  for (let i = 0; i < RN; i++) {
    const t  = (i/RN) * Math.PI * 2;
    const s  = Math.sin(n*t + ph);
    const r1 = R + r*s, r2 = R - r*s;
    const isHL = (i % Math.round(RN/n)) === 0;
    ctx.strokeStyle = isHL ? rgba(CORAL, 0.85) : PALE;
    ctx.lineWidth   = isHL ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(cx + r1*Math.cos(t), cy + r1*Math.sin(t));
    ctx.lineTo(cx + r2*Math.cos(t), cy + r2*Math.sin(t));
    ctx.stroke();
  }

  const crx  = ringCrossings(n, ph, 0, Math.PI*2);
  const segs = makeSegs(crx, 0, Math.PI*2);

  function strand(tS, tE, isS1, lw) {
    const N = Math.max(8, Math.round((tE-tS)/(Math.PI*2)*600));
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const t   = tS + (i/N)*(tE-tS);
      const rad = R + r*Math.sin(n*t+ph)*(isS1?1:-1);
      const x   = cx + rad*Math.cos(t), y = cy + rad*Math.sin(t);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
  }

  for (const [tS, tE] of segs) {
    const f1top = Math.sin(n*(tS+tE)/2 + ph) > 0;
    ctx.strokeStyle = f1top ? rgba(GREEN,0.75) : rgba(TEAL,0.75);
    strand(tS, tE, !f1top, 2);
    ctx.strokeStyle = f1top ? TEAL : GREEN;
    strand(tS, tE,  f1top, 3);
  }
}

let t0 = null;
function frame(ts) {
  if (!t0) t0 = ts;
  draw((ts - t0) / 1000 * 1.1);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
