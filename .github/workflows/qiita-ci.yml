# name: Qiita CI

on:
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: ruff
        uses: actions/setup-python@v2
        with:
          python-version: "3.9"
      - name: install dependencies
        run: python -m pip install --upgrade pip
      - name: Check out repository code
        uses: actions/checkout@v2
      - name: lint
        run: |
          pip install -q ruff
          ruff check qiita_core qiita_db qiita_explore scripts/qiita*
